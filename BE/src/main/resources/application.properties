# Load environment variables from .env
spring.config.import=optional:file:.env[.properties]

# Application
spring.application.name=Sstorage
server.port=8081
server.address=0.0.0.0

# Supabase PostgreSQL connection
spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/postgres?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Jackson
spring.jackson.deserialization.fail-on-unknown-properties=true

# CORS
app.cors.allowed-origins=*

# JWT: 8 hours
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=28800000

# Admin credentials
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}